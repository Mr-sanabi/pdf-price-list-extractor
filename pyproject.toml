[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-price-list-extractor"
version = "0.1.0"
description = "Extract structured product data from PDF price lists"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.26,<2",
    "pydantic>=2.11,<3",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
