<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="338" viewBox="0 0 1200 338" role="img" aria-labelledby="title desc">
  <title id="title">PDF Price List Extractor</title>
  <desc id="desc">A Python document extraction tool that converts structured PDF price lists into CSV and Excel.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d141c"/>
      <stop offset="1" stop-color="#111a23"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset=".5" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#f2b36a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="338" fill="#0a1016"/>
  <path d="M24 0v338" stroke="#354251"/>
  <rect x="67" y="10" width="1074" height="318" rx="24" fill="url(#background)"/>
  <rect x="67" y="10" width="1074" height="4" rx="2" fill="url(#accent)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="127" y="70" fill="#8f9aaa" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="2.8">PYTHON DOCUMENT EXTRACTION</text>
    <text x="127" y="119" fill="#f4f6f8" font-size="37" font-weight="800">PDF Price List Extractor</text>
    <text x="127" y="151" fill="#b7c0cc" font-size="16">Structured product data from PDF price lists into CSV and Excel.</text>

    <g font-size="12" font-weight="650" text-anchor="middle">
      <rect x="127" y="191" width="136" height="38" rx="19" fill="#111923" stroke="#2a3542"/>
      <text x="195" y="215" fill="#d9dee5">PyMuPDF</text>
      <rect x="276" y="191" width="136" height="38" rx="19" fill="#111923" stroke="#2a3542"/>
      <text x="344" y="215" fill="#d9dee5">Pydantic</text>
      <rect x="425" y="191" width="136" height="38" rx="19" fill="#111923" stroke="#2a3542"/>
      <text x="493" y="215" fill="#d9dee5">CLI</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="710" y="66" width="370" height="206" rx="22" fill="#151e27" stroke="#252f3a"/>
    </g>

    <g font-family="Consolas, Menlo, monospace" font-size="10" font-weight="800" text-anchor="middle">
      <rect x="739" y="94" width="86" height="58" rx="11" fill="#102239" stroke="#245e94" stroke-width="2"/>
      <text x="782" y="119" fill="#64b3ff">PDF</text>
      <text x="782" y="137" fill="#7890aa" font-size="8">PAGE 01</text>

      <path d="M837 123h30" stroke="#65707e" stroke-width="2"/>
      <path d="m861 118 6 5-6 5" fill="none" stroke="#65707e" stroke-width="2"/>

      <rect x="879" y="94" width="86" height="58" rx="11" fill="#0d2b1b" stroke="#176c38" stroke-width="2"/>
      <text x="922" y="119" fill="#48c66b">EXTRACT</text>
      <text x="922" y="137" fill="#789b84" font-size="8">5 RECORDS</text>

      <path d="M977 123h30" stroke="#65707e" stroke-width="2"/>
      <path d="m1001 118 6 5-6 5" fill="none" stroke="#65707e" stroke-width="2"/>

      <rect x="1019" y="94" width="86" height="58" rx="11" fill="#302113" stroke="#7d4f1c" stroke-width="2"/>
      <text x="1062" y="119" fill="#f2ae58">EXPORT</text>
      <text x="1062" y="137" fill="#a38b72" font-size="8">CSV / XLSX</text>
    </g>

    <rect x="739" y="176" width="366" height="70" rx="12" fill="#0a1117" stroke="#202b34"/>
    <circle cx="759" cy="199" r="5" fill="#3fb950"/>
    <text x="775" y="204" fill="#9da8b5" font-size="10">Accepted records</text>
    <text x="1082" y="204" fill="#eef2f5" font-size="13" font-weight="800" text-anchor="end">5</text>
    <circle cx="759" cy="225" r="5" fill="#58a6ff"/>
    <text x="775" y="230" fill="#9da8b5" font-size="10">Rejected records</text>
    <text x="1082" y="230" fill="#eef2f5" font-size="13" font-weight="800" text-anchor="end">0</text>
  </g>
</svg>
